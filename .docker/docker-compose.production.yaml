name: WEST_PRODUCTION

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.production
    image: west:${APP_VERSION:-production}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      DATABASE_ENGINE: postgres
      SECRET_KEY: ${SECRET_KEY}
      OMIE_CREDENTIALS_ENCRYPTION_KEY: ${OMIE_CREDENTIALS_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
    volumes:
      - WEST_STATIC:/app/staticfiles
      - WEST_MEDIA:/app/media
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - WEST_NETWORK
    logging: *default-logging

  scheduler:
    image: west:${APP_VERSION:-production}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      RUN_DJANGO_SETUP: "False"
      DEBUG: "False"
      DATABASE_ENGINE: postgres
      SECRET_KEY: ${SECRET_KEY}
      OMIE_CREDENTIALS_ENCRYPTION_KEY: ${OMIE_CREDENTIALS_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
    command: ["python", "manage.py", "monitorar_sincronizacoes_agendadas", "--intervalo-segundos", "60", "--tolerancia-minutos", "10"]
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - WEST_NETWORK
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - WEST_POSTGRES_DATA:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - WEST_NETWORK
    logging: *default-logging

  proxy:
    image: nginx:alpine
    environment:
      DOMAIN: ${DOMAIN}
      PROXY_CLIENT_MAX_BODY_SIZE: ${PROXY_CLIENT_MAX_BODY_SIZE:-50M}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.active.conf:/etc/nginx/templates/default.conf.template:ro
      - WEST_CERTBOT_WWW:/var/www/certbot
      - WEST_CERTBOT_CONF:/etc/letsencrypt
      - WEST_STATIC:/app/staticfiles:ro
      - WEST_MEDIA:/app/media:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - WEST_NETWORK
    logging: *default-logging

  certbot:
    image: certbot/certbot
    volumes:
      - WEST_CERTBOT_WWW:/var/www/certbot
      - WEST_CERTBOT_CONF:/etc/letsencrypt
    networks:
      - WEST_NETWORK
    logging: *default-logging

volumes:
  WEST_POSTGRES_DATA:
    name: WEST_POSTGRES_DATA
  WEST_STATIC:
    name: WEST_STATIC
  WEST_MEDIA:
    name: WEST_MEDIA
  WEST_CERTBOT_WWW:
    name: WEST_CERTBOT_WWW
  WEST_CERTBOT_CONF:
    name: WEST_CERTBOT_CONF

networks:
  WEST_NETWORK:
    name: WEST_NETWORK
