name: ${COMPOSE_PROJECT_NAME:-WEST_PRODUCTION}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.production
    image: ${APP_IMAGE_NAME:-west}:${APP_VERSION:-production}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      OMIE_CREDENTIALS_ENCRYPTION_KEY: ${OMIE_CREDENTIALS_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      APP_BRAND_NAME: ${APP_BRAND_NAME:-MD21 BI}
      APP_BRAND_NAVBAR_TEXT: ${APP_BRAND_NAVBAR_TEXT:-MD21 BI}
      APP_BRAND_LOGIN_LOGO: ${APP_BRAND_LOGIN_LOGO:-logo_elevdata_semfundo.png}
      APP_BRAND_NAVBAR_LOGO: ${APP_BRAND_NAVBAR_LOGO:-logo_elevdata_new.jpg}
      APP_BRAND_HERO_EYEBROW: ${APP_BRAND_HERO_EYEBROW:-BEM-VINDO}
      APP_BRAND_HERO_TITLE: ${APP_BRAND_HERO_TITLE:-Dados claros e<br>decisoes melhores.}
      APP_BRAND_HERO_SUBTITLE: ${APP_BRAND_HERO_SUBTITLE:-Uma visao completa da sua operacao, do comercial ao financeiro, em um so lugar.}
      APP_BRAND_REGISTER_EYEBROW: ${APP_BRAND_REGISTER_EYEBROW:-MD21 BUSINESS INTELLIGENCE}
      APP_BRAND_REGISTER_TITLE: ${APP_BRAND_REGISTER_TITLE:-Sua empresa<br>vista por inteiro.}
      APP_BRAND_REGISTER_SUBTITLE: ${APP_BRAND_REGISTER_SUBTITLE:-Crie sua conta para acessar indicadores comerciais, financeiros, compras, estoque e CRM.}
      APP_BRAND_META_DESCRIPTION: ${APP_BRAND_META_DESCRIPTION:-MD21 BI - Inteligencia para decisoes melhores}
      APP_BRAND_FOOTER_TEXT: ${APP_BRAND_FOOTER_TEXT:-2026 ELEVDATA}
      APP_BRAND_FOOTER_SUBTITLE: ${APP_BRAND_FOOTER_SUBTITLE:-Inteligencia para decisoes melhores.}
      APP_BRAND_ADMIN_HEADER: ${APP_BRAND_ADMIN_HEADER:-MD21 BI - Administracao}
      APP_BRAND_ADMIN_TITLE: ${APP_BRAND_ADMIN_TITLE:-MD21 BI}
      APP_BRAND_ADMIN_INDEX_TITLE: ${APP_BRAND_ADMIN_INDEX_TITLE:-Gestao da plataforma}
      ENABLE_PAYMENT_APPROVAL_DASHBOARD: ${ENABLE_PAYMENT_APPROVAL_DASHBOARD:-True}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - app_network
    logging: *default-logging

  scheduler:
    image: ${APP_IMAGE_NAME:-west}:${APP_VERSION:-production}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      RUN_DJANGO_SETUP: "False"
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      OMIE_CREDENTIALS_ENCRYPTION_KEY: ${OMIE_CREDENTIALS_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      APP_BRAND_NAME: ${APP_BRAND_NAME:-MD21 BI}
      APP_BRAND_NAVBAR_TEXT: ${APP_BRAND_NAVBAR_TEXT:-MD21 BI}
      APP_BRAND_LOGIN_LOGO: ${APP_BRAND_LOGIN_LOGO:-logo_elevdata_semfundo.png}
      APP_BRAND_NAVBAR_LOGO: ${APP_BRAND_NAVBAR_LOGO:-logo_elevdata_new.jpg}
      APP_BRAND_HERO_EYEBROW: ${APP_BRAND_HERO_EYEBROW:-BEM-VINDO}
      APP_BRAND_HERO_TITLE: ${APP_BRAND_HERO_TITLE:-Dados claros e<br>decisoes melhores.}
      APP_BRAND_HERO_SUBTITLE: ${APP_BRAND_HERO_SUBTITLE:-Uma visao completa da sua operacao, do comercial ao financeiro, em um so lugar.}
      APP_BRAND_REGISTER_EYEBROW: ${APP_BRAND_REGISTER_EYEBROW:-MD21 BUSINESS INTELLIGENCE}
      APP_BRAND_REGISTER_TITLE: ${APP_BRAND_REGISTER_TITLE:-Sua empresa<br>vista por inteiro.}
      APP_BRAND_REGISTER_SUBTITLE: ${APP_BRAND_REGISTER_SUBTITLE:-Crie sua conta para acessar indicadores comerciais, financeiros, compras, estoque e CRM.}
      APP_BRAND_META_DESCRIPTION: ${APP_BRAND_META_DESCRIPTION:-MD21 BI - Inteligencia para decisoes melhores}
      APP_BRAND_FOOTER_TEXT: ${APP_BRAND_FOOTER_TEXT:-2026 ELEVDATA}
      APP_BRAND_FOOTER_SUBTITLE: ${APP_BRAND_FOOTER_SUBTITLE:-Inteligencia para decisoes melhores.}
      APP_BRAND_ADMIN_HEADER: ${APP_BRAND_ADMIN_HEADER:-MD21 BI - Administracao}
      APP_BRAND_ADMIN_TITLE: ${APP_BRAND_ADMIN_TITLE:-MD21 BI}
      APP_BRAND_ADMIN_INDEX_TITLE: ${APP_BRAND_ADMIN_INDEX_TITLE:-Gestao da plataforma}
      ENABLE_PAYMENT_APPROVAL_DASHBOARD: ${ENABLE_PAYMENT_APPROVAL_DASHBOARD:-True}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "manage.py", "monitorar_sincronizacoes_agendadas", "--intervalo-segundos", "60", "--tolerancia-minutos", "10"]
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - app_network
    logging: *default-logging

  proxy:
    image: nginx:alpine
    environment:
      DOMAIN: ${DOMAIN}
      PROXY_CLIENT_MAX_BODY_SIZE: ${PROXY_CLIENT_MAX_BODY_SIZE:-50M}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.active.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - app_network
    logging: *default-logging

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    networks:
      - app_network
    logging: *default-logging

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-WEST_POSTGRES_DATA}
  static_data:
    name: ${STATIC_VOLUME_NAME:-WEST_STATIC}
  media_data:
    name: ${MEDIA_VOLUME_NAME:-WEST_MEDIA}
  certbot_www:
    name: ${CERTBOT_WWW_VOLUME_NAME:-WEST_CERTBOT_WWW}
  certbot_conf:
    name: ${CERTBOT_CONF_VOLUME_NAME:-WEST_CERTBOT_CONF}

networks:
  app_network:
    name: ${DOCKER_NETWORK_NAME:-WEST_NETWORK}
