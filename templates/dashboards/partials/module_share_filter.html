<input type="hidden" name="usar_modulo" value="{{ filtros_modulo_ativos|yesno:'1,0' }}" data-module-share-value>
<button class="btn btn-white share-filter-button{% if filtros_modulo_ativos %} is-active{% endif %}" type="button" data-module-share-toggle aria-pressed="{{ filtros_modulo_ativos|yesno:'true,false' }}" title="{% if filtros_modulo_ativos %}Compartilhamento ativo em {{ area_atual.titulo }}. Clique em Atualizar para aplicar os filtros.{% else %}Ative para compartilhar os filtros compatíveis em {{ area_atual.titulo }} e clique em Atualizar.{% endif %}">
    <i class="bi bi-link-45deg" aria-hidden="true"></i>
    <span>Usar no módulo</span>
</button>
